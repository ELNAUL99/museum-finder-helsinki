spring:
  application:
    name: museumfinder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/museumfinder}
    username: ${DB_USER:museumfinder}
    password: ${DB_PASSWORD:museumfinder}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Helsinki
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names: nlQueries
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

museumfinder:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Override in any real deployment: export JWT_SECRET="$(openssl rand -base64 48)"
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnop}
    ttl-minutes: 10080
  ai:
    enabled: ${AI_SEARCH_ENABLED:true}
    # Leave blank to use the ANTHROPIC_API_KEY environment variable.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    max-tokens: 2048

logging:
  level:
    com.museumfinder: INFO
