spring:
  application:
    name: museumfinder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/museumfinder}
    username: ${DB_USER:museumfinder}
    password: ${DB_PASSWORD:museumfinder}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # Deliberately no hibernate.jdbc.time_zone. Opening hours are wall-clock LocalTimes
    # with no zone of their own - 11:00 means 11:00 on the museum's door. Setting a JDBC
    # time zone makes the driver shift them by the server's offset, which silently moved
    # every museum's hours by two hours once the app ran in a UTC container. "Now" is
    # handled where it belongs instead: the Clock bean in AppConfig is Europe/Helsinki.
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names: nlQueries
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

museumfinder:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Override in any real deployment: export JWT_SECRET="$(openssl rand -base64 48)"
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnop}
    ttl-minutes: 10080
  ai:
    enabled: ${AI_SEARCH_ENABLED:true}
    # auto picks the best provider whose key is present; or pin one: claude, mistral, none.
    provider: ${AI_PROVIDER:auto}
    # Leave blank to use the ANTHROPIC_API_KEY / MISTRAL_API_KEY environment variables.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    mistral-api-key: ${MISTRAL_API_KEY:}
    mistral-model: mistral-small-latest
    max-tokens: 2048

logging:
  level:
    com.museumfinder: INFO
